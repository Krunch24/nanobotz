services:
  nano:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./nano-source:/opt/nano-source:ro
      - ./nano-data:/var/lib/nano
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
